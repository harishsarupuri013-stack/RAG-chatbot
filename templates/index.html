<!DOCTYPE html>
<html>

<head>

    <title>PDF RAG Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>PDF RAG Chatbot</h1>

        <form method="POST">

            <textarea
                name="question"
                placeholder="Ask question..."
            >{{ question }}</textarea>

            <button type="submit">
                Ask
            </button>

        </form>

        {% if answer %}

            <div class="answer">

                <h3>Answer:</h3>

                <p>{{ answer }}</p>

            </div>

        {% endif %}

    </div>

</body>

</html>
